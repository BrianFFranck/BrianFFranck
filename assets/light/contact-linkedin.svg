<rect x="14" y="14" width="48" height="48" rx="8" fill="#1d4ed8" fill-opacity=".1" stroke="#1d4ed8" stroke-opacity=".5"/>
<rect x="26" y="26" width="24" height="24" rx="4" fill="none" stroke="#1d4ed8" stroke-width="2"/>
