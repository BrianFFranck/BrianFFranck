<text x="78" y="48" font-size="14" fill="#d6e4ec" text-anchor="start" font-weight="700" letter-spacing="0">in/brian-franck-</text>
<text x="78" y="64" font-size="10.5" fill="#60a5fa" text-anchor="start" font-weight="400" letter-spacing="0.5">click to connect</text>
