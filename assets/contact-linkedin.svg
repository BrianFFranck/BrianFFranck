<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 76" width="320" height="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#12202b"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softU" filterUnits="userSpaceOnUse" x="-600" y="-600" width="2400" height="2000"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="cyg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e7490"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>

<style>
  .blink{animation:blink 1.1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  .flow{stroke-dasharray:5 6;animation:flow 1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-22}}

</style>
</defs>
<rect x="0.5" y="0.5" width="319" height="75" rx="8" fill="#070b10" stroke="#1a2a36"/>
<rect x="0.5" y="0.5" width="319" height="75" rx="8" fill="url(#dots)"/>
<rect x="0.5" y="0.5" width="319" height="75" rx="8" fill="none" stroke="#60a5fa" stroke-width="1.5" pathLength="100" stroke-dasharray="14 86" filter="url(#softU)"><animate attributeName="stroke-dashoffset" values="0;-100" dur="5s" repeatCount="indefinite"/></rect>
<rect x="14" y="14" width="48" height="48" rx="8" fill="#60a5fa" fill-opacity=".1" stroke="#60a5fa" stroke-opacity=".5"/>
<rect x="26" y="26" width="24" height="24" rx="4" fill="none" stroke="#60a5fa" stroke-width="2"/>
<circle cx="32.5" cy="32.5" r="1.9" fill="#60a5fa"><animate attributeName="r" values="1.9;2.6;1.9" dur="2.4s" repeatCount="indefinite"/></circle>
<path d="M32.5 36.5 V45 M38 45 V36.5 M38 40.5 a3.6 3.6 0 0 1 7.2 0 V45" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round"/>
