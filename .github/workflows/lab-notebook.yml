name: Lab notebook card

# Rebuilds assets/lab.svg from the Iris experiment log, so the profile shows the latest real run.
# Iris triggers this right after a full training run (workflow_dispatch); the schedule is a safety net.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/lab_card.py", ".github/workflows/lab-notebook.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the experiment log
        # the API always serves the newest commit; the raw CDN can lag a few minutes behind a push
        run: >
          curl -fsSL -H "Accept: application/vnd.github.raw" -H "Authorization: Bearer ${{ github.token }}"
          https://api.github.com/repos/BrianFFranck/IRIS/contents/experiments.md
          -o "$RUNNER_TEMP/experiments.md"
      - name: Build the card
        run: python tools/lab_card.py "$RUNNER_TEMP/experiments.md" assets README.md
      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain assets README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/lab.svg assets/light/lab.svg README.md
            git commit -m "Lab notebook: refresh from the Iris experiment log"
            git push
          fi
